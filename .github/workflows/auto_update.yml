name: Auto Update TV360 Tokens

on:
  schedule:
    # Chạy mỗi 3 giờ
    - cron: "0 */3 * * *"

  # Cho phép chạy thủ công
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tv360:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update TV360 tokens
        run: |
          python update_tokens.py

      - name: Show changes
        run: |
          git status --short
          git diff -- ht-tv.m3u

      - name: Commit and push
        run: |
          if git diff --quiet -- ht-tv.m3u; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ht-tv.m3u

          git commit -m "chore: auto update TV360 tokens"

          git push origin HEAD:main
